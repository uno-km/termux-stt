[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-stt"
version = "1.0.4"
description = "Android on-device STT framework for Termux — whisper.cpp, vosk, sherpa-onnx unified"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Eunho Kim (@uno-km)"}
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
termux-stt = "termux_stt.cli.main:main"
termux-stt-install = "termux_stt.platform.installer:main"

[project.urls]
Homepage = "https://github.com/uno-km/termux-stt"
Repository = "https://github.com/uno-km/termux-stt"
Documentation = "https://github.com/uno-km/termux-stt#readme"
Issues = "https://github.com/uno-km/termux-stt/issues"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E722"]

[tool.ruff.lint.isort]
known-first-party = ["termux_stt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["termux_stt*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


