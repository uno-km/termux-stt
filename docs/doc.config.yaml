advanced_parameters_body: |
  <h3>1. Whisper.cpp GGML Quantization Profiles</h3>
  <p>Select the optimal quantization level to balance memory footprint and acoustic precision:</p>
  <table class="data-table">
    <thead>
      <tr><th>Quantization Level</th><th>Memory Overhead</th><th>Relative Speed</th><th>Recommended Use Case</th></tr>
    </thead>
    <tbody>
      <tr><td><code>f16</code></td><td>100% (Baseline)</td><td>1.0x</td><td>Reference accuracy on desktop and high-end ARM nodes.</td></tr>
      <tr><td><code>q8_0</code></td><td>55%</td><td>1.3x</td><td>Near-lossless precision with reduced RAM consumption.</td></tr>
      <tr><td><code>q5_1</code> / <code>q5_0</code></td><td>35%</td><td>1.8x</td><td><strong>Optimal mobile default:</strong> High accuracy within minimal RAM.</td></tr>
      <tr><td><code>q4_0</code></td><td>28%</td><td>2.2x</td><td>Extreme memory constraints (devices with &lt;2GB total RAM).</td></tr>
    </tbody>
  </table>

  <h3>2. Advanced Decoding & Search Parameters</h3>
  <table class="data-table">
    <thead>
      <tr><th>CLI Flag</th><th>SDK Key</th><th>Default</th><th>Description</th></tr>
    </thead>
    <tbody>
      <tr>
        <td><code>--beam-size &lt;N&gt;</code></td>
        <td><code>beam_size</code></td>
        <td><code>1</code></td>
        <td>Expands beam search width (e.g. <code>5</code>) for complex audio with overlapping speakers.</td>
      </tr>
      <tr>
        <td><code>--best-of &lt;N&gt;</code></td>
        <td><code>best_of</code></td>
        <td><code>1</code></td>
        <td>Number of candidate candidate sequences sampled during decoding.</td>
      </tr>
      <tr>
        <td><code>--temperature &lt;T&gt;</code></td>
        <td><code>temperature</code></td>
        <td><code>0.0</code></td>
        <td>Sampling temperature. <code>0.0</code> enables deterministic greedy search.</td>
      </tr>
      <tr>
        <td><code>--no-fallback</code> / <code>-nf</code></td>
        <td><code>no_fallback</code></td>
        <td><code>True (Termux)</code></td>
        <td>Prevents multi-temperature retry loops to avoid mobile CPU overheating.</td>
      </tr>
      <tr>
        <td><code>--prompt &lt;TEXT&gt;</code></td>
        <td><code>prompt</code></td>
        <td><code>None</code></td>
        <td>Provides vocabulary context hints (acronyms, domain terms, speaker names).</td>
      </tr>
      <tr>
        <td><code>--translate</code> / <code>-tr</code></td>
        <td><code>translate</code></td>
        <td><code>False</code></td>
        <td>Translates multilingual foreign speech directly into English text.</td>
      </tr>
      <tr>
        <td><code>--extra-args "&lt;FLAGS&gt;"</code></td>
        <td><code>extra_args</code></td>
        <td><code>None</code></td>
        <td>Raw C++ flag passthrough directly to the underlying whisper.cpp binary.</td>
      </tr>
    </tbody>
  </table>

  <h3>3. Direct Local Custom Model Paths (BitNet / LLaMA / Fine-tuned Weights)</h3>
  <p>Pass local file paths directly to bypass ModelHub downloading and execute custom fine-tuned models:</p>
  <pre><code># Direct path to local fine-tuned or BitNet 1.58b GGML weights
  termux-stt transcribe audio.wav --model /sdcard/models/custom-whisper-q5_1.bin</code></pre>

  <h3>4. CPU Big-Core Pinning & Mobile Thermal Management</h3>
  <pre><code># Pin execution to 4 high-performance big cores (Cortex-A78 / X1)
  termux-stt transcribe audio.wav --threads 4</code></pre>

