code_example_py: |
  from termux_stt import create_engine

  # 1. Initialize Engine (auto-loads native ARM NEON binary & cached model)
  engine = create_engine("whisper", model="tiny", lang="en", threads=4)

  # 2. Transcribe Audio directly into Subtitles
  result = engine.transcribe("samples/jfk_1min.wav")
  print("Transcript:\n", result.text)
  print("SRT Subtitles:\n", result.to_srt())

  # 3. 2-Speaker Diarization without PyTorch
  hybrid = create_engine("hybrid", lang="en", num_speakers=2)
  diar_result = hybrid.diarize("samples/jfk_1min.wav")
  for seg in diar_result.segments:
      print(f"[{seg.speaker}] ({seg.start:.1f}s -> {seg.end:.1f}s): {seg.text}")

code_example_js: |
  const { createEngine } = require("termux-stt");

  async function main() {
    // 1. Initialize Whisper Engine
    const engine = createEngine("whisper", { model: "tiny", lang: "en", threads: 4 });

    // 2. Transcribe Audio
    const result = await engine.transcribe("samples/jfk_1min.wav");
    console.log("Transcript:", result.text);
    console.log("SRT Subtitles:\n", result.toSrt());
  }
  main();

installation_body: |
  <div class="alert alert-tip">
    <span class="alert-title">1-Click Self-Contained Automated Installation</span>
    <p><code>termux-stt</code> includes an automated self-contained installer that provisions all native dependencies, compiles ARM NEON C++ binaries, and verifies hardware vector extensions in a single command.</p>
  </div>

  <h3>1. Automated Package Installation</h3>
  
  <h4>Python Edition (PyPI):</h4>
  <pre><code># 1. Install official PyPI package
  pip install --upgrade termux-stt

  # 2. 1-Click native compiler and dependency provisioning
  termux-stt install</code></pre>

  <h4>Node.js / TypeScript Edition (npm):</h4>
  <pre><code># 1. Install official global npm package
  npm install -g termux-stt

  # 2. 1-Click native setup
  termux-stt install</code></pre>

  <h3>2. Android Termux Prerequisites & System Dependencies</h3>
  <p>If you are provisioning a clean Android Termux environment from scratch, execute the following system package installations:</p>
  <pre><code># Update Termux repository index and install native toolchain
  pkg update -y && pkg install -y \
    python \
    nodejs-lts \
    ffmpeg \
    libbluray \
    libxml2 \
    cmake \
    make \
    clang \
    git \
    termux-api</code></pre>

  <h3>3. Self-Healing Diagnostic Health Check</h3>
  <p>Verify that your system environment, audio linkers, and ARM NEON binaries are fully functional:</p>
  <pre><code>termux-stt doctor</code></pre>
  <p><strong>Expected Terminal Output:</strong></p>
  <pre><code>System Environment Check:
  -----------------------------------
  OS: Android (aarch64)
  ✅ [OK] ffmpeg is installed
  ✅ [OK] whisper.cpp engine found
  ✅ [OK] Python 3.13.x
  -----------------------------------
  Doctor check complete.</code></pre>

  <h3>4. Air-Gapped / Offline Deployment</h3>
  <p>For strictly air-gapped devices without internet access, pre-seed GGML models into the local cache directory:</p>
  <pre><code># Cache directory structure
  mkdir -p ~/.cache/termux-stt/models/whisper
  cp ggml-tiny.bin ~/.cache/termux-stt/models/whisper/
  cp ggml-small.bin ~/.cache/termux-stt/models/whisper/</code></pre>

quickstart_body: |
  <div class="alert alert-tip">
    <span class="alert-title">Included 60.00s JFK Sample Audio</span>
    <p><code>termux-stt</code> packages John F. Kennedy's 1961 Inaugural Address (<code>samples/jfk_1min.wav</code>, 16kHz Mono PCM) for instant out-of-the-box verification!</p>
  </div>

  <h3>Recipe 1: 1-Line Subtitle Transcription (SRT / WebVTT / JSON)</h3>
  <pre><code># 1. Transcribe audio and export to synchronized SRT subtitles
  termux-stt transcribe samples/jfk_1min.wav --format srt > subtitles.srt

  # 2. Export directly to WebVTT for HTML5 video players
  termux-stt transcribe samples/jfk_1min.wav --format vtt > subtitles.vtt

  # 3. Export to structured JSON for data pipelines
  termux-stt transcribe samples/jfk_1min.wav --format json > output.json</code></pre>

  <h3>Recipe 2: 128d Speaker Diarization ("Who Spoke When?")</h3>
  <p>Run high-precision 2-speaker diarization using pure Python K-Means clustering without PyTorch:</p>
  <pre><code>termux-stt diarize samples/jfk_1min.wav --speakers 2 --format text</code></pre>
  <p><strong>Sample Output:</strong></p>
  <pre><code>[Speaker 0] Vice President Johnson, Mr. Speaker, Mr. Chief Justice, President Eisenhower...
  [Speaker 0] Nixon, President Truman, Reverend clergy, fellow citizens...
  [Speaker 1] We observe today not a victory of party, but a celebration of freedom...</code></pre>

  <h3>Recipe 3: Real-Time Microphone Streaming</h3>
  <p>Speak directly into your smartphone microphone with low latency and real-time Silero-VAD silence filtering:</p>
  <pre><code># CLI real-time listener (Press Ctrl+C to terminate)
  termux-stt listen --engine whisper --model tiny --lang ko</code></pre>

  <h3>Recipe 4: High-Precision Domain Prompting & Translation</h3>
  <pre><code># Provide context prompt hints for specialized medical/technical vocabularies and translate to English
  termux-stt transcribe meeting.wav \
    --model small \
    --prompt "AMEVA-Forge, WebGPU, ARM NEON, Bionic libc" \
    --translate \
    --format srt</code></pre>

  <h3>Recipe 5: Programmatic Python SDK Integration</h3>
  <pre><code>from termux_stt import create_engine

  # 1. Initialize Engine with optimal threads
  engine = create_engine("whisper", model="base", lang="en", threads=4)

  # 2. Transcribe Audio
  result = engine.transcribe("samples/jfk_1min.wav")

  print("Full Transcript:", result.text)
  print(f"Detected Duration: {result.duration:.2f}s")
  print("SRT Block:\n", result.to_srt())</code></pre>

  <h3>Recipe 6: Programmatic Node.js / TypeScript API</h3>
  <pre><code>const { createEngine } = require("termux-stt");

  async function transcribeAudio() {
    const engine = createEngine("whisper", { model: "tiny", lang: "en", threads: 4 });
    const result = await engine.transcribe("samples/jfk_1min.wav");
    
    console.log("Total Segments:", result.segments.length);
    console.log("SRT Output:\n", result.toSrt());
  }
  transcribeAudio();</code></pre>

api_body: |
  <h3>1. Top-Level Engine Factory</h3>
  <table class="data-table">
    <thead>
      <tr><th>Function</th><th>Parameters</th><th>Return Type</th><th>Description</th></tr>
    </thead>
    <tbody>
      <tr>
        <td><code>create_engine</code></td>
        <td><code>engine="whisper", model=None, lang="ko", threads=None, vad=True, quantization="q5_1", num_speakers=0, **kwargs</code></td>
        <td><code>Engine</code></td>
        <td>Instantiates and returns the configured concrete STT or Hybrid engine instance.</td>
      </tr>
    </tbody>
  </table>

  <h3>2. Core Engine Methods (<code>Engine</code> Abstract Base)</h3>
  <table class="data-table">
    <thead>
      <tr><th>Method</th><th>Signature</th><th>Return Type</th><th>Description</th></tr>
    </thead>
    <tbody>
      <tr>
        <td><code>transcribe</code></td>
        <td><code>(audio_path: str, **kwargs)</code></td>
        <td><code>TranscriptResult</code></td>
        <td>Transcribes audio file with subprocess crash isolation and returns full text with timestamped segments.</td>
      </tr>
      <tr>
        <td><code>diarize</code></td>
        <td><code>(audio_path: str, num_speakers: int = 2)</code></td>
        <td><code>DiarizedResult</code></td>
        <td>Runs the full hybrid diarization pipeline (128d X-Vector + K-Means + STT).</td>
      </tr>
      <tr>
        <td><code>stream_mic</code></td>
        <td><code>(duration: Optional[float] = None)</code></td>
        <td><code>Iterator[Segment]</code></td>
        <td>Streams live audio from the device microphone and yields transcribed segments in real time.</td>
      </tr>
      <tr>
        <td><code>stream_file</code></td>
        <td><code>(audio_path: str, chunk_sec: float = 5.0)</code></td>
        <td><code>Iterator[Segment]</code></td>
        <td>Streams audio from a file in chunks and yields transcription segments sequentially.</td>
      </tr>
      <tr>
        <td><code>get_info</code></td>
        <td><code>()</code></td>
        <td><code>Dict[str, Any]</code></td>
        <td>Returns engine status metadata, active model name, language, and hardware thread configuration.</td>
      </tr>
    </tbody>
  </table>

  <h3>3. Data Structures & Subtitle Formatters</h3>
  
  <h4><code>TranscriptResult</code> Struct:</h4>
  <ul>
    <li><code>text: str</code> - Full reconstructed transcription text.</li>
    <li><code>language: str</code> - Detected or configured ISO 639-1 language code.</li>
    <li><code>segments: List[Segment]</code> - Timestamped utterance segments.</li>
    <li><code>duration: float</code> - Total audio duration in seconds.</li>
    <li><code>to_srt() -> str</code> - Serializes segments into valid SubRip (SRT) format.</li>
    <li><code>to_vtt() -> str</code> - Serializes segments into WebVTT format.</li>
    <li><code>to_json() -> str</code> - Serializes transcript and segment offsets into valid JSON.</li>
    <li><code>to_rttm() -> str</code> - Serializes segments into NIST Rich Transcription (RTTM) format.</li>
  </ul>

  <h4><code>Segment</code> Struct:</h4>
  <ul>
    <li><code>start: float</code> - Start timestamp in seconds (precision: 0.001s).</li>
    <li><code>end: float</code> - End timestamp in seconds.</li>
    <li><code>text: str</code> - Transcribed text within the interval.</li>
    <li><code>speaker: Optional[str]</code> - Assigned speaker cluster identifier (e.g. <code>"Speaker 0"</code>).</li>
  </ul>

  <h3>4. Model Management & Preprocessing Subsystems</h3>
  <table class="data-table">
    <thead>
      <tr><th>Module / Class</th><th>Method</th><th>Description</th></tr>
    </thead>
    <tbody>
      <tr>
        <td><code>ModelHub</code></td>
        <td><code>ensure_model(engine, model_name) -> str</code></td>
        <td>Verifies local cache or downloads model binary with SHA-256 integrity verification.</td>
      </tr>
      <tr>
        <td><code>preprocessor</code></td>
        <td><code>preprocess(audio_path, target_sr=16000, force_mono=True) -> str</code></td>
        <td>Direct pure-Python WAV parser or auto-converting FFmpeg fallback.</td>
      </tr>
      <tr>
        <td><code>MobileGuard</code></td>
        <td><code>acquire_wakelock() / monitor_memory()</code></td>
        <td>Acquires Android CPU WakeLock and monitors process RSS against OOM limits.</td>
      </tr>
    </tbody>
  </table>

