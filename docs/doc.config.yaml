# docs/doc.config.yaml
name: "Termux-STT"
package_name_pypi: "termux-stt"
package_name_npm: "termux-stt"
version: "v1.0.9"
release_name: "Production Release"
license: "Apache-2.0"
platform: "Android ARM64 / Termux Bionic"
github_repo_url: "https://github.com/uno-km/termux-stt"

tagline_en: "Unified On-Device Speech-to-Text & Pure Python 128d X-Vector Speaker Diarization"
tagline_ko: "통합 온디바이스 음성인식(STT) 및 순수 Python 128d X-Vector 화자 분리 프레임워크"

quick_install_cmd: "pip install --upgrade termux-stt && termux-stt install\n# or Node.js:\nnpm install -g termux-stt && termux-stt install"

why_challenge_en: "Transcribing and diarizing multi-speaker conversations on edge devices typically demands heavy PyTorch runtimes (>2GB), external GPU servers, and severe cloud network latency with audio privacy risks."
why_challenge_ko: "모바일 및 엣지 단말기에서 다중 화자 음성 인식 및 화자 분리를 수행하려면 2GB 이상의 무거운 PyTorch 런타임, 클라우드 API 호출 비용, 오디오 개인정보 유출 위험 및 심각한 지연시간이 발생합니다."

description_en: "Integrates Whisper.cpp, Vosk, and Sherpa-ONNX with a closed-form pure-Python 128-dimensional X-Vector clustering algorithm that operates in under 80MB RAM with zero cloud egress."
description_ko: "Whisper.cpp, Vosk, Sherpa-ONNX 3대 네이티브 엔진을 통합하고, 닫힌 형태 순수 Python 128차원 X-Vector 클러스터링을 결합하여 80MB 미만의 초경량 메모리로 100% 온디바이스 실시간 음성인식과 화자 분리를 구현합니다."

features:
  - title_en: "Triple STT Engine Integration"
    title_ko: "3대 STT 엔진 통합 지원"
    desc_en: "Seamlessly switches between Whisper.cpp (accuracy), Vosk (latency), and Sherpa-ONNX with a single create_engine() factory."
    desc_ko: "단일 create_engine() 팩토리 API를 통해 Whisper.cpp(정밀도), Vosk(초저지연), Sherpa-ONNX 엔진을 자유롭게 전환합니다."
  - title_en: "Pure Python Speaker Diarization"
    title_ko: "순수 Python 128d 화자 분리"
    desc_en: "128-dimensional Vosk X-Vector embeddings combined with closed-form pure Python K-Means clustering without PyTorch or Scikit-Learn."
    desc_ko: "PyTorch나 Scikit-Learn 의존성 없이 128차원 X-Vector 임베딩과 순수 파이썬 K-Means 군집화로 화자별 발화 구간을 정밀 분리합니다."
  - title_en: "Zero-Subprocess Audio Fastpath"
    title_ko: "Zero-Subprocess 음원 파싱"
    desc_en: "Direct pure-Python wave parser integration for standard 16kHz WAVs, bypassing FFmpeg subprocessing with zero Bionic linker errors."
    desc_ko: "표준 16kHz WAV 음원을 순수 Python wave 모듈로 직결 파싱하여 FFmpeg 서브프로세스 호출 오버헤드를 0ms로 단축하고 Bionic 링커 결함을 원천 예방합니다."
  - title_en: "Zero Cloud Egress Audio Privacy"
    title_ko: "100% 온디바이스 오디오 보안"
    desc_en: "Audio capture, acoustic feature extraction, and text transcription execute strictly on the local CPU without cloud telemetry leaks."
    desc_ko: "음성 수집, 음향 특징 추출, 텍스트 전사 및 자막 생성이 외부 네트워크 전송 없이 단말기 로컬 CPU에서만 독립 구동됩니다."
  - title_en: "Subprocess Crash Isolation"
    title_ko: "서브프로세스 장애 격리 보호"
    desc_en: "Isolates native C++ binaries within dedicated process pools, ensuring C++ segfaults never compromise the host Python or Node.js runtime."
    desc_ko: "C++ 네이티브 엔진을 전용 서브프로세스 풀로 완벽 격리하여 C++ 세그멘테이션 폴트가 발생해도 호스트 런타임의 안전성을 100% 보장합니다."
  - title_en: "Mobile Hardware Optimization"
    title_ko: "모바일 하드웨어 최적화"
    desc_en: "Automatic big.LITTLE core thread pinning, Android WakeLock management, and 1-pass greedy decoding preventing thermal throttling."
    desc_ko: "ARM 빅코어 전담 스레드 할당, Android WakeLock 수명 주기 제어, 1-Pass 그리디 정책으로 모바일 배터리와 발열을 정밀 제어합니다."

